version: '3.8'

services:
  cms:
    image: kpi-cms:latest
    ports:
      - '3100:3000' # CMS exposed on 3100
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - API_PROXY_TARGET=${API_PROXY_TARGET}
      - API_SERVICE_EMAIL=${API_SERVICE_EMAIL:-admin@example.com}
      - API_SERVICE_PASSWORD=${API_SERVICE_PASSWORD:-Admin@123}
    networks:
      - kpi_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', { redirect: 'manual' }).then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure

networks:
  kpi_network:
    external: true
